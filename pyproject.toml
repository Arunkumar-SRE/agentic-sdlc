[project]
name = "agentic-sdlc"
version = "2.0.0"
description = "Agentic software-engineering workflow: requirement -> reviewable engineering outcome"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.6,<3", "PyYAML>=6", "structlog>=24"]

[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]
service = ["fastapi>=0.115", "sqlalchemy>=2.0", "httpx>=0.27", "uvicorn>=0.30"]
dev = ["pytest>=8", "mypy>=1.10", "ruff>=0.5", "types-PyYAML"]

[project.scripts]
agentic-sdlc = "agentic_sdlc.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider"

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["agentic_sdlc"]
ignore_missing_imports = true
warn_unused_ignores = false
plugins = ["pydantic.mypy"]

[tool.ruff]
line-length = 140
target-version = "py311"
extend-exclude = ["workspace", "targets"]
